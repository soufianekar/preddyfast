# Precompute the public site's products and publish them to the HF Dataset.
#
# DISABLED until you choose to publish: manual runs only, and uploads only
# when the `upload` box is ticked. To schedule it, move the `schedule:` block
# below under `on:`. Repository settings needed:
#   secrets   HF_TOKEN (write access to the Dataset), CDS_KEY (maps gallery)
#   variables PRECOMPUTE_HF_REPO ("user/preddyfast-data")
#
# Each run first mirrors what the Dataset already holds, so a store whose
# newest run is already published, a gallery month already drawn, or a run
# already scored is skipped. The point and CDS caches are kept between runs
# by actions/cache, so only new runs are read from the archives.
#
#  schedule:
#    - cron: "30 8 * * *"    # after the 00 UTC runs reach the archive
#    - cron: "30 20 * * *"   # after the 12 UTC runs

name: precompute

on:
  workflow_dispatch:
    inputs:
      scores:
        description: "Score and draw the evaluation stations"
        type: boolean
        default: true
      maps:
        description: "Draw the ERA5 maps gallery (needs CDS_KEY)"
        type: boolean
        default: true
      upload:
        description: "Publish to the HF Dataset (needs HF_TOKEN)"
        type: boolean
        default: false

concurrency:
  group: precompute
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PRECOMPUTE_HF_REPO: ${{ vars.PRECOMPUTE_HF_REPO }}
      CDS_KEY: ${{ secrets.CDS_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      POINT_CACHE_DIR: .point-cache
      CDS_CACHE_DIR: .cds-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            .point-cache
            .cds-cache
            .obs-cache
          key: archive-${{ github.run_id }}
          restore-keys: archive-
      - name: Precompute
        run: >
          python scripts/precompute.py
          ${{ (github.event_name == 'schedule' || inputs.scores) && '--scores' || '' }}
          ${{ (github.event_name == 'schedule' || inputs.maps) && '--maps' || '' }}
          ${{ (github.event_name == 'schedule' || inputs.upload) && '--upload-hf' || '' }}

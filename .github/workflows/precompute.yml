# Precompute the public site's products and publish them to the HF Dataset.
#
# DISABLED until you choose to publish: manual runs only, and uploads only
# when the `upload` box is ticked. To schedule it, move the `schedule:` block
# below under `on:`. Repository settings needed:
#   secrets   HF_TOKEN (write access to the Dataset), CDS_KEY (maps gallery)
#   variables PRECOMPUTE_HF_REPO ("user/preddyfast-data")
#
# Each run first mirrors what the Dataset already holds, so a store whose
# newest run is already published or a gallery month already drawn is
# skipped. The point, CDS and observation caches and the scorecard's working
# state (.scorecard: per-init rows, frozen network) are kept between runs by
# actions/cache, so only new runs are read from the archives and an init is
# rescored, as observations arrive, from extracts already on disk.
#
# The scorecard fills its 14-day window newest init first, as much as one run
# allows. To fill it from scratch, dispatch with `backfill` ticked (oldest
# first, stops cleanly after 300 min) and repeat until a run writes nothing
# new; each run resumes where the last stopped.
#
#  schedule:
#    - cron: "30 8 * * *"    # after the 00 UTC runs reach the archive
#    - cron: "30 20 * * *"   # after the 12 UTC runs

name: precompute

on:
  workflow_dispatch:
    inputs:
      scorecard:
        description: "Refresh the station scorecard"
        type: boolean
        default: true
      backfill:
        description: "Scorecard backfill: oldest init first, stop after 300 min (repeat until done)"
        type: boolean
        default: false
      maps:
        description: "Draw the ERA5 maps gallery (needs CDS_KEY)"
        type: boolean
        default: true
      upload:
        description: "Publish to the HF Dataset (needs HF_TOKEN)"
        type: boolean
        default: false

concurrency:
  group: precompute
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    # A backfill stops itself at 300 min; the margin lets the upload and the
    # cache save (skipped when a job times out) still run.
    timeout-minutes: ${{ inputs.backfill && 350 || 120 }}
    env:
      PRECOMPUTE_HF_REPO: ${{ vars.PRECOMPUTE_HF_REPO }}
      CDS_KEY: ${{ secrets.CDS_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      POINT_CACHE_DIR: .point-cache
      CDS_CACHE_DIR: .cds-cache
      SCORECARD_DIR: .scorecard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            .point-cache
            .cds-cache
            .obs-cache
            .scorecard
          key: archive-${{ github.run_id }}
          restore-keys: archive-
      - name: Precompute
        run: >
          python scripts/precompute.py
          ${{ (github.event_name == 'schedule' || inputs.scorecard || inputs.backfill) && '--scorecard' || '' }}
          ${{ inputs.backfill && '--backfill --max-minutes 300' || '' }}
          ${{ (github.event_name == 'schedule' || inputs.maps) && '--maps' || '' }}
          ${{ (github.event_name == 'schedule' || inputs.upload) && '--upload-hf' || '' }}

# Precompute the public site's products and publish them to the HF Dataset.
#
# DISABLED until you choose to publish: manual runs only, and uploads only
# when the `upload` box is ticked. To schedule it, move the `schedule:` block
# below under `on:`. Repository settings needed:
#   secrets   HF_TOKEN (write access to the Dataset), CDS_KEY (maps gallery)
#   variables PRECOMPUTE_HF_REPO ("user/preddyfast-data"),
#             PRECOMPUTE_HF_STATE_REPO ("user/preddyfast-state", private)
#   HF_TOKEN needs read + write on both Datasets.
#
# Jobs, in parallel on public runners (each its own 6 h budget):
#   animations  a matrix, one job per model group (IFS ENS + control, AIFS ENS,
#               GEFS, AIFS single); a group's failure never stops the others
#   scorecard   the station scorecard
#   maps        the ERA5 maps gallery
#   globe       the global AIFS Single fields for the globe page (opt-in)
# Each job writes its products to .precomputed and uploads them as a one-day
# artifact (a "part"); none uploads to the Dataset. The publish job then
# downloads every part, merges them with the Dataset's mirror, and uploads
# once, only the files that changed: no two jobs ever write the same file or
# race on the Dataset. A producer that fails still lets publish run; the
# stores it owned keep their published entries and frames.
#
# Every job first mirrors what the Dataset already holds, so a store whose
# newest run is already published or a gallery month already drawn is
# skipped. The scorecard's working state (.scorecard: per-init rows, frozen
# network, window) lives in the private state Dataset: scripts/state.py pulls
# it before the job and pushes what changed after, even when the job stopped
# part-way; push refuses unless the pull succeeded. The point, CDS and
# observation caches are rebuildable downloads and stay in actions/cache, so
# only new runs are read from the archives and an init is rescored, as
# observations arrive, from extracts already on disk.
#
# The scorecard fills its 14-day window newest init first, as much as 60 min
# allows per run. To fill it from scratch, dispatch with `backfill` ticked:
# scorecard only (no animations, no maps), oldest first, stops cleanly after
# 300 min; repeat until a run writes nothing new. Each run resumes where the
# last stopped, and the caches are saved even when a run fails.
#
#  schedule:
#    - cron: "30 8 * * *"    # after the 00 UTC runs reach the archive
#    - cron: "30 20 * * *"   # after the 12 UTC runs

name: precompute

on:
  workflow_dispatch:
    inputs:
      animations:
        description: "Draw the forecast animations (one job per model group; skipped on backfill)"
        type: boolean
        default: true
      scorecard:
        description: "Refresh the station scorecard"
        type: boolean
        default: true
      backfill:
        description: "Scorecard backfill only (no animations or maps): oldest init first, stop after 300 min; repeat until done"
        type: boolean
        default: false
      maps:
        description: "Draw the ERA5 maps gallery (needs CDS_KEY)"
        type: boolean
        default: true
      globe:
        description: "Global AIFS Single fields for the globe page"
        type: boolean
        default: false
      upload:
        description: "Publish to the HF Dataset (needs HF_TOKEN)"
        type: boolean
        default: false

concurrency:
  group: precompute
  cancel-in-progress: false

jobs:
  animations:
    if: ${{ inputs.animations && !inputs.backfill || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group:
          - "ifs_ens ifs_control"
          - "aifs_ens"
          - "gefs"
          - "aifs_single"
    env:
      PRECOMPUTE_HF_REPO: ${{ vars.PRECOMPUTE_HF_REPO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Precompute
        timeout-minutes: 110
        run: python scripts/precompute.py --stores ${{ matrix.group }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part-${{ strategy.job-index }}
          path: .precomputed
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: warn
          overwrite: true

  scorecard:
    if: ${{ github.event_name == 'schedule' || inputs.scorecard || inputs.backfill }}
    runs-on: ubuntu-latest
    # Every scorecard run stops itself between inits (--max-minutes: 300 for a
    # backfill, 60 otherwise) and writes its aggregates; the Precompute step's
    # own timeout sits below the job's, so a step that still overruns fails
    # rather than the job being cancelled, and the always() cache save runs.
    timeout-minutes: ${{ inputs.backfill && 350 || 90 }}
    env:
      PRECOMPUTE_HF_REPO: ${{ vars.PRECOMPUTE_HF_REPO }}
      PRECOMPUTE_HF_STATE_REPO: ${{ vars.PRECOMPUTE_HF_STATE_REPO }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      POINT_CACHE_DIR: .point-cache
      SCORECARD_DIR: .scorecard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Restore and save are separate so a failed or overrun run still keeps
      # the extracts and rows it made (actions/cache saves on success only).
      - uses: actions/cache/restore@v4
        with:
          path: |
            .point-cache
            .obs-cache
          key: scorecard-${{ github.run_id }}
          restore-keys: scorecard-
      - name: Pull scorecard state
        id: pull
        run: python scripts/state.py pull
      - name: Precompute
        timeout-minutes: ${{ inputs.backfill && 335 || 70 }}
        run: >
          python scripts/precompute.py --no-animations --scorecard
          ${{ inputs.backfill && '--backfill --max-minutes 300' || '--max-minutes 60' }}
      - name: Push scorecard state
        if: ${{ always() && steps.pull.outcome == 'success' }}
        run: python scripts/state.py push
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            .point-cache
            .obs-cache
          key: scorecard-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part-scorecard
          path: .precomputed
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: warn
          overwrite: true

  maps:
    if: ${{ (inputs.maps && !inputs.backfill) || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PRECOMPUTE_HF_REPO: ${{ vars.PRECOMPUTE_HF_REPO }}
      CDS_KEY: ${{ secrets.CDS_KEY }}
      CDS_CACHE_DIR: .cds-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Split restore/save, as in the scorecard job.
      - uses: actions/cache/restore@v4
        with:
          path: .cds-cache
          key: maps-${{ github.run_id }}
          restore-keys: maps-
      - name: Precompute
        timeout-minutes: 110
        run: python scripts/precompute.py --no-animations --maps
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cds-cache
          key: maps-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part-maps
          path: .precomputed
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: warn
          overwrite: true

  globe:
    if: ${{ inputs.globe && !inputs.backfill }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PRECOMPUTE_HF_REPO: ${{ vars.PRECOMPUTE_HF_REPO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Precompute
        run: python scripts/precompute.py --no-animations --globe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part-globe
          path: .precomputed
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: warn
          overwrite: true

  publish:
    needs: [animations, scorecard, maps, globe]
    if: ${{ !cancelled() && (inputs.upload || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRECOMPUTE_HF_REPO: ${{ vars.PRECOMPUTE_HF_REPO }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
      - name: Merge and upload
        run: |
          if ! compgen -G "parts/*" > /dev/null; then
            echo "No parts produced: nothing to publish."
            exit 0
          fi
          python scripts/publish.py parts/* --upload-hf

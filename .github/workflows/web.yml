# Publish the static globe page (web/) to GitHub Pages.
#
# This publishes the site PUBLICLY. Manual runs only; never run it without the
# repository owner's go-ahead. Pages must first be enabled in the repository
# settings (Settings > Pages > Source: GitHub Actions). The page reads its
# data from the Dataset named in web/js/config.js.
name: web

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
